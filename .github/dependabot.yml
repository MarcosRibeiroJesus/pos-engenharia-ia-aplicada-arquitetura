version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: "/"
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directories: ["/modulos/**"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directories: ["/", "/modulos/**"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    cooldown:
      default-days: 7
    directories: ["/modulos/**"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directories: ["/modulos/**"]
    schedule: { interval: weekly }
