name: "01.03 recomendação · apply (ambiente protegido)"

# Apply só por disparo manual, em ambiente protegido (aprovação obrigatória configurada no GitHub).
on:
  workflow_dispatch:
    inputs:
      enable_mwaa:
        description: "Ligar o MWAA (~US$ 0,49/h, maior custo fixo do stack)"
        type: boolean
        default: false
      enable_serverless_inference:
        description: "SageMaker Serverless Inference (custo zero ocioso)"
        type: boolean
        default: true
      explanations_enabled:
        description: "Explicações com Claude via Bedrock"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: recsys-01-03-state   # apply e destroy nunca rodam juntos
  cancel-in-progress: false

env:
  TF_DIR: modulos/01-fundamentos-ia-llms/unidades/03-recomendacao/infra/terraform
  TF_VERSION: 1.13.4

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-lab
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Init com state remoto
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=modulos/01-fundamentos-ia-llms/03-recomendacao/lab.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Plan
        env:
          TF_VAR_enable_mwaa: ${{ inputs.enable_mwaa }}
          TF_VAR_enable_serverless_inference: ${{ inputs.enable_serverless_inference }}
          TF_VAR_explanations_enabled: ${{ inputs.explanations_enabled }}
          TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS || '[]' }}
        run: terraform plan -input=false -lock-timeout=120s -out=tfplan
      - name: Apply do plan revisado
        run: terraform apply -input=false -lock-timeout=120s tfplan
