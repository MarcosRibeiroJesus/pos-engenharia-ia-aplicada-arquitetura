name: Smoke test no Floci

on:
  pull_request:
    paths: ["testing/**", ".github/workflows/smoke-floci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      floci:
        # Fixe uma tag de release na variável FLOCI_IMAGE (a doc do Floci recomenda isso no CI).
        image: ${{ vars.FLOCI_IMAGE || 'floci/floci:latest' }}
        ports: ["4566:4566"]
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      EMULATOR_NAME: Floci (GitHub Actions)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint awscli
      - name: Aguardar o Floci
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4566 && exit 0
            sleep 2
          done
          echo "Floci não respondeu" && exit 1
      - run: python3 testing/scripts/run_tests.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-smoke
          path: testing/reports/
