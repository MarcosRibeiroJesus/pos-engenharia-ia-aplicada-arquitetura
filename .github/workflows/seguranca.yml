# Esteira de segurança e FinOps. Roda em todo PR, na main e semanalmente.
# Achado alto ou crítico bloqueia o merge. Exceções só com justificativa versionada e ADR.
name: Segurança e FinOps

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Limite mensal da conta, somando todas as demonstrações do mês (D-022). O teto de cada projeto é diário (D-021).
  CUSTO_MAX_MENSAL_USD: ${{ vars.CUSTO_MAX_MENSAL_USD || '20' }}

jobs:
  descobrir:
    name: Descobrir alvos
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.alvos.outputs.terraform }}
      dockerfiles: ${{ steps.alvos.outputs.dockerfiles }}
      dast: ${{ steps.alvos.outputs.dast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: alvos
        run: python3 .github/ia/descobrir_alvos.py >> "$GITHUB_OUTPUT"

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep e zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: python -m pip install --quiet semgrep zizmor
      - name: Semgrep
        run: |
          semgrep scan --config p/default --config p/secrets --config p/terraform \
            --config p/dockerfile --sarif --output semgrep.sarif --metrics off || true
      - name: zizmor (segurança dos workflows)
        run: zizmor --config .github/zizmor.yml --format sarif .github/workflows > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('zizmor.sarif') != ''
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-sast
          path: "*.sarif"
      - name: Bloquear em severidade alta
        run: python3 .github/ia/gate_sarif.py semgrep.sarif zizmor.sarif

  codeql:
    name: SAST (CodeQL ${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: codeql-${{ matrix.linguagem }}

  sca:
    name: SCA, licenças e SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Revisão de dependências do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
      - name: Trivy (vulnerabilidades, licenças e segredos no repositório)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: SBOM (SPDX)
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-sca
          path: "*.sarif"
      - name: Bloquear em severidade alta
        if: always()
        run: python3 .github/ia/gate_sarif.py trivy-fs.sarif

  iac:
    name: IaC (tflint e checkov)
    needs: descobrir
    # Sempre roda: o ruleset exige o SARIF do checkov (que também audita github_actions, dockerfile e secrets).
    if: always() && needs.descobrir.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: needs.descobrir.outputs.terraform != '[]'
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: needs.descobrir.outputs.terraform != '[]'
      - name: fmt, validate e tflint por diretório
        if: needs.descobrir.outputs.terraform != '[]'
        env:
          DIRS: ${{ needs.descobrir.outputs.terraform }}
        run: |
          set -euo pipefail
          falhas=0
          for d in $(echo "$DIRS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            echo "::group::$d"
            terraform -chdir="$d" fmt -check -recursive || falhas=1
            terraform -chdir="$d" init -backend=false -input=false >/dev/null && terraform -chdir="$d" validate || falhas=1
            (cd "$d" && tflint --init >/dev/null && tflint --format compact) || falhas=1
            echo "::endgroup::"
          done
          exit "$falhas"
      - name: checkov
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          directory: .
          framework: terraform,github_actions,dockerfile,secrets
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          download_external_modules: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-iac
          path: "*.sarif"

  conteineres:
    name: Imagem ${{ matrix.dockerfile }}
    needs: descobrir
    if: needs.descobrir.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.descobrir.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -t alvo:ci -f "$DOCKERFILE" "$(dirname "$DOCKERFILE")"
      - name: Trivy (imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: alvo:ci
          format: sarif
          output: trivy-imagem.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('trivy-imagem.sarif') != ''
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem-${{ strategy.job-index }}
      - name: Bloquear em severidade alta
        run: python3 .github/ia/gate_sarif.py trivy-imagem.sarif

  dast:
    name: DAST (ZAP) ${{ matrix.alvo.nome }}
    needs: descobrir
    if: needs.descobrir.outputs.dast != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        alvo: ${{ fromJSON(needs.descobrir.outputs.dast) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Subir o serviço da unidade
        env:
          COMPOSE: ${{ matrix.alvo.compose }}
          URL: ${{ matrix.alvo.url }}
        run: |
          docker compose -f "$COMPOSE" up -d --build
          # Exige 3 respostas seguidas: uma só resposta não prova que o serviço estabilizou
          # (no run 45321301256 o alvo resetou conexões logo após subir e o ZAP abortou).
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "$URL"; then ok=$((ok + 1)); else ok=0; fi
            [ "$ok" -ge 3 ] && exit 0
            sleep 3
          done
          docker compose -f "$COMPOSE" logs; exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.alvo.url }}
          rules_file_name: .zap/rules.tsv   # exceções versionadas, cada uma com ADR
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-${{ strategy.job-index }}

  finops:
    name: FinOps (Infracost)
    needs: descobrir
    # Sempre roda: o ruleset exige resultado de FinOps e SARIF "Infracost" mesmo em PRs sem mudança de IaC.
    if: always() && needs.descobrir.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar chave do Infracost
        id: chave
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::warning::Secret INFRACOST_API_KEY ausente: estimativa de custo pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verificar se há Terraform no PR
        id: iac
        env:
          DIRS: ${{ needs.descobrir.outputs.terraform }}
        run: |
          if [ "$DIRS" = "[]" ]; then
            echo "::notice::Sem Terraform neste PR: nada a estimar. O check FinOps fica verde."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        if: steps.iac.outputs.tem == 'true' && steps.chave.outputs.ok == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Estimar custo por diretório
        if: steps.iac.outputs.tem == 'true' && steps.chave.outputs.ok == 'true'
        env:
          DIRS: ${{ needs.descobrir.outputs.terraform }}
        run: |
          python3 -c 'import json,os; ds=json.loads(os.environ["DIRS"]); print("version: 0.1\nprojects:"); [print(f"  - path: {d}") for d in ds]' > infracost.yml
          infracost breakdown --config-file infracost.yml --format json --out-file infracost.json
          infracost output --path infracost.json --format table
      - name: Comentar no PR
        if: steps.iac.outputs.tem == 'true' && steps.chave.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: infracost comment github --path infracost.json --repo "$REPO" --pull-request "$PR" --github-token "$GITHUB_TOKEN" --behavior update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.iac.outputs.tem == 'true' && steps.chave.outputs.ok == 'true'
        with:
          name: finops
          path: infracost.json
      - name: Testes do gate de custo
        run: python3 -m unittest discover -s .github/ia/testes
      - name: Bloquear acima do teto diário do projeto ou do limite mensal da conta
        if: steps.iac.outputs.tem == 'true' && steps.chave.outputs.ok == 'true'
        # D-021: teto = custo de um dia de demonstração (harness/estado.json). D-022: limite mensal da conta.
        run: python3 .github/ia/gate_custo.py infracost.json "$CUSTO_MAX_MENSAL_USD" harness/estado.json
      - name: Gerar SARIF do Infracost para o ruleset
        if: always()
        run: |
          python3 -c 'import json; json.dump({"$schema": "https://json.schemastore.org/sarif-2.1.0.json", "version": "2.1.0", "runs": [{"tool": {"driver": {"name": "Infracost", "informationUri": "https://www.infracost.io", "rules": []}}, "results": []}]}, open("infracost.sarif", "w"))'
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('infracost.sarif') != ''
        with:
          sarif_file: infracost.sarif
          category: infracost

  revisao-ia:
    name: Agentes revisores (segurança e FinOps)
    needs: [descobrir, sast, sca, iac, finops]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Só booleanos no job: o segredo entra apenas no passo que chama o Claude (revisão do #34).
      TEM_ASSINATURA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      TEM_API: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      AWS_BEDROCK_ROLE_ARN: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sarif-*,finops}"
          path: achados
          merge-multiple: true
      - name: Scripts e agentes da base (não do head do PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - id: provedor
        run: bash .base/.github/ia/provedor.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.provedor.outputs.provedor == 'bedrock'
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.provedor.outputs.provedor != 'nenhum'
        with:
          node-version: "22"
      - name: Revisão independente
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          PROVEDOR: ${{ steps.provedor.outputs.provedor }}
          ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .base/.github/ia/revisar.sh

  correcao-ia:
    name: Agente corretor (rótulo auto-fix)
    needs: [sast, sca, iac]
    if: >-
      always() && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'auto-fix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # Só booleanos no job: o segredo entra apenas no passo que chama o Claude (revisão do #34).
      TEM_ASSINATURA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      TEM_API: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      AWS_BEDROCK_ROLE_ARN: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: achados
          merge-multiple: true
      - name: Scripts e agentes da base (não do head do PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - id: provedor
        run: bash .base/.github/ia/provedor.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.provedor.outputs.provedor == 'bedrock'
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.provedor.outputs.provedor != 'nenhum'
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.provedor.outputs.provedor != 'nenhum'
      - name: Corrigir e validar (sem token do GitHub)
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          PROVEDOR: ${{ steps.provedor.outputs.provedor }}
          ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: bash .base/.github/ia/corrigir.sh
      - name: Publicar correção no PR
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .base/.github/ia/publicar_correcao.sh
