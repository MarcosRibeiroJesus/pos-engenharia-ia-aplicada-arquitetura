# Esteira de segurança e FinOps. Roda em todo PR, na main e semanalmente.
# Achado alto ou crítico bloqueia o merge. Exceções só com justificativa versionada e ADR.
name: Segurança e FinOps

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CUSTO_MAX_MENSAL_USD: ${{ vars.CUSTO_MAX_MENSAL_USD || '50' }}

jobs:
  descobrir:
    name: Descobrir alvos
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.alvos.outputs.terraform }}
      dockerfiles: ${{ steps.alvos.outputs.dockerfiles }}
      dast: ${{ steps.alvos.outputs.dast }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: alvos
        run: python3 .github/ia/descobrir_alvos.py >> "$GITHUB_OUTPUT"

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep e zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: python -m pip install --quiet semgrep zizmor
      - name: Semgrep
        run: |
          semgrep scan --config p/default --config p/secrets --config p/terraform \
            --config p/dockerfile --sarif --output semgrep.sarif --metrics off || true
      - name: zizmor (segurança dos workflows)
        run: zizmor --config .github/zizmor.yml --format sarif .github/workflows > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sarif-sast
          path: "*.sarif"
      - name: Bloquear em severidade alta
        run: python3 .github/ia/gate_sarif.py semgrep.sarif zizmor.sarif

  codeql:
    name: SAST (CodeQL ${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: codeql-${{ matrix.linguagem }}

  sca:
    name: SCA, licenças e SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Revisão de dependências do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
      - name: Trivy (vulnerabilidades, licenças e segredos no repositório)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sarif-sca
          path: "*.sarif"
      - name: Bloquear em severidade alta
        run: python3 .github/ia/gate_sarif.py trivy-fs.sarif

  iac:
    name: IaC (tflint e checkov)
    needs: descobrir
    if: needs.descobrir.outputs.terraform != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: fmt, validate e tflint por diretório
        env:
          DIRS: ${{ needs.descobrir.outputs.terraform }}
        run: |
          set -euo pipefail
          falhas=0
          for d in $(echo "$DIRS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            echo "::group::$d"
            terraform -chdir="$d" fmt -check -recursive || falhas=1
            terraform -chdir="$d" init -backend=false -input=false >/dev/null && terraform -chdir="$d" validate || falhas=1
            (cd "$d" && tflint --init >/dev/null && tflint --format compact) || falhas=1
            echo "::endgroup::"
          done
          exit "$falhas"
      - name: checkov
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          directory: .
          framework: terraform,github_actions,dockerfile,secrets
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          download_external_modules: false
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sarif-iac
          path: "*.sarif"

  conteineres:
    name: Imagem ${{ matrix.dockerfile }}
    needs: descobrir
    if: needs.descobrir.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.descobrir.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -t alvo:ci -f "$DOCKERFILE" "$(dirname "$DOCKERFILE")"
      - name: Trivy (imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: alvo:ci
          format: sarif
          output: trivy-imagem.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always()
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem-${{ strategy.job-index }}
      - name: Bloquear em severidade alta
        run: python3 .github/ia/gate_sarif.py trivy-imagem.sarif

  dast:
    name: DAST (ZAP) ${{ matrix.alvo.nome }}
    needs: descobrir
    if: needs.descobrir.outputs.dast != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        alvo: ${{ fromJSON(needs.descobrir.outputs.dast) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Subir o serviço da unidade
        env:
          COMPOSE: ${{ matrix.alvo.compose }}
          URL: ${{ matrix.alvo.url }}
        run: |
          docker compose -f "$COMPOSE" up -d --build
          for _ in $(seq 1 40); do curl -fsS -o /dev/null "$URL" && exit 0; sleep 3; done
          docker compose -f "$COMPOSE" logs; exit 1
      - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ matrix.alvo.url }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-${{ strategy.job-index }}

  finops:
    name: FinOps (Infracost)
    needs: descobrir
    if: needs.descobrir.outputs.terraform != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verificar chave do Infracost
        id: chave
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::warning::Secret INFRACOST_API_KEY ausente: estimativa de custo pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        if: steps.chave.outputs.ok == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Estimar custo por diretório
        if: steps.chave.outputs.ok == 'true'
        env:
          DIRS: ${{ needs.descobrir.outputs.terraform }}
        run: |
          python3 -c 'import json,os; ds=json.loads(os.environ["DIRS"]); print("version: 0.1\nprojects:"); [print(f"  - path: {d}") for d in ds]' > infracost.yml
          infracost breakdown --config-file infracost.yml --format json --out-file infracost.json
          infracost output --path infracost.json --format table
      - name: Comentar no PR
        if: steps.chave.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: infracost comment github --path infracost.json --repo "$REPO" --pull-request "$PR" --github-token "$GITHUB_TOKEN" --behavior update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: finops
          path: infracost.json
      - name: Bloquear acima do teto mensal
        if: steps.chave.outputs.ok == 'true'
        run: python3 .github/ia/gate_custo.py infracost.json "$CUSTO_MAX_MENSAL_USD"

  revisao-ia:
    name: Agentes revisores (segurança e FinOps)
    needs: [descobrir, sast, sca, iac, finops]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEDROCK_ROLE_ARN: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{sarif-*,finops}"
          path: achados
          merge-multiple: true
      - id: provedor
        run: bash .github/ia/provedor.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.provedor.outputs.provedor == 'bedrock'
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.provedor.outputs.provedor != 'nenhum'
        with:
          node-version: "22"
      - name: Revisão independente
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVEDOR: ${{ steps.provedor.outputs.provedor }}
          ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .github/ia/revisar.sh

  correcao-ia:
    name: Agente corretor (rótulo auto-fix)
    needs: [sast, sca, iac]
    if: >-
      always() && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'auto-fix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEDROCK_ROLE_ARN: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sarif-*
          path: achados
          merge-multiple: true
      - id: provedor
        run: bash .github/ia/provedor.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.provedor.outputs.provedor == 'bedrock'
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.provedor.outputs.provedor != 'nenhum'
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.provedor.outputs.provedor != 'nenhum'
      - name: Corrigir e validar (sem token do GitHub)
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          PROVEDOR: ${{ steps.provedor.outputs.provedor }}
          ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: bash .github/ia/corrigir.sh
      - name: Publicar correção no PR
        if: steps.provedor.outputs.provedor != 'nenhum'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/ia/publicar_correcao.sh
