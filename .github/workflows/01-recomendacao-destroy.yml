name: "01-recomendacao · destroy (ambiente protegido)"
# checkov:skip=CKV_GHA_7: workflow de implantação, não de build; confirm_stack é comparado ao nome do stack antes de qualquer ação. ADR docs/adr/0002

# Modelo (harness/modelos). Disparo manual ou pelo expirar-infra.yml quando o prazo vence (D-022).
on:
  workflow_dispatch:
    inputs:
      confirm_stack:
        description: "Digite o nome do stack para confirmar (01-recomendacao-lab)"
        required: true
        type: string

# Permissões mínimas: o token OIDC só no job que acessa a AWS (zizmor excessive-permissions).
permissions:
  contents: read

concurrency:
  group: 01-recomendacao-state
  cancel-in-progress: false

env:
  CHAVE: 01-recomendacao
  STACK_NAME: 01-recomendacao-lab
  PROJECT_TAG: 01-recomendacao
  TF_DIR: modulos/01-fundamentos-ia-llms/unidades/03-recomendacao/infra/terraform
  STATE_KEY: 01-recomendacao/lab.tfstate

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # D-024: ambiente próprio do destroy, sem aprovação e restrito ao main, para o destroy automático
    # não esperar ninguém. O apply continua no aws-lab, com aprovação.
    environment: aws-lab-destroy
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # Chave do state (saída state_kms_key_arn do infra/conta). Vazia: o init segue sem kms_key_id,
      # como hoje; contra o bucket do infra/conta ele falha fechado com AccessDenied (T032, D-012).
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      REGIAO: ${{ vars.AWS_REGION || 'us-east-1' }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Confirmação pelo nome do stack
        env:
          CONFIRM: ${{ inputs.confirm_stack }}
        run: |
          if [ "$CONFIRM" != "$STACK_NAME" ]; then
            echo "::error::Confirmação '$CONFIRM' não confere com '$STACK_NAME'. Nada foi destruído."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_01_RECOMENDACAO || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Init com state remoto
        run: |
          KMS_ARGS=()
          if [ -n "$TF_STATE_KMS_KEY_ARN" ]; then KMS_ARGS=(-backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"); fi
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$STATE_KEY" \
            -backend-config="region=$REGIAO" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true" "${KMS_ARGS[@]}"
      - name: Destroy
        run: terraform destroy -input=false -auto-approve -lock-timeout=120s
      - name: Verificar sobras pela tag do projeto
        run: |
          left=$(aws resourcegroupstaggingapi get-resources --tag-filters Key=project,Values="$PROJECT_TAG" \
            --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' | grep -v '^$' || true)
          # Ajuste por projeto: chaves KMS em PendingDeletion e serviços INACTIVE não são sobra com custo.
          if [ -n "$left" ]; then
            echo "::error::Recursos com tag project=$PROJECT_TAG ainda existem:"; echo "$left"; exit 1
          fi
          echo "Nenhuma sobra com a tag project=$PROJECT_TAG."

  prazo:
    # Só depois da verificação de sobras: se o destroy falhar, o registro fica e o agendador tenta de novo.
    needs: destroy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remover o registro de prazo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 harness/infra.py remover "$CHAVE"
