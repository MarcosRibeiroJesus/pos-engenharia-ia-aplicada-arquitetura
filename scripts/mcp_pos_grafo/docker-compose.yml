services:
  neo4j-pos:
    image: neo4j:5-community
    container_name: pos-grafo-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/pos_grafo_local}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ../../.neo4j-data/data:/data
      - ../../.neo4j-data/logs:/logs
    restart: unless-stopped
