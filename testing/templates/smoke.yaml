AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Smoke test de infraestrutura para validar o harness local.
  Recursos mínimos com padrões de segurança e tags de custo.

Parameters:
  ProjectName:
    Type: String
    Default: lab-smoke
    AllowedPattern: "^[a-z0-9-]{3,30}$"

Resources:
  FeatureBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-features-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation

  RecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation

Outputs:
  FeatureBucketName:
    Value: !Ref FeatureBucket
  RecommendationsTableName:
    Value: !Ref RecommendationsTable
